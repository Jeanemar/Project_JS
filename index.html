
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Demo</title>
    <link rel="stylesheet" href="./sample.css">
</head>
<body>

    <div class="profile-container" id="profile">
        <h1>Student Profile</h1>

        <h3 id="studentName">Bello, Jeanemar B.</h3>
        <p id="studentCourse">BS Computer Science - 3rd Year</p>

        <div class="buttons">
            <button id="changeName">Change Name</button>
            <button id="changeBackground">Change Background</button>
            <button id="toggleDetails">Show/Hide Details</button>
        </div>

        <p id="details" class="hidden">
            Bello, Jeanemar B. is a Third Year Collage Student, Taking a Bachelor of Science in Computer Science Here in Debesmscat. A
            Student who have a desire to gain more knowledge and learn new things about programming.
        </p>
    </div>
<script src="./samplescript.js" charset="UTF-8"></script>
</body>
</html>
